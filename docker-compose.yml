# Full-stack local run: FastAPI backend + built React frontend (nginx).
#
#   cp .env.example .env      # then fill in any LLM/data-source API keys you use
#   docker compose up --build
#
#   Frontend -> http://localhost:5173
#   Backend  -> http://localhost:8000  (health: /health)
#
# Both ports are published to 127.0.0.1 only: the API has no authentication by default,
# so it must not be exposed to untrusted networks. To require a token, set
# SCIENCEKG_API_TOKEN in .env and send "Authorization: Bearer <token>" from clients.
#
# Local LLM backends (Ollama :11434, LM Studio :1234, ...) usually run on the HOST, not
# in these containers. Point config.yaml at them via http://host.docker.internal:<port>
# (host-gateway is wired up below) instead of http://localhost:<port>.
#
# WICHTIG — nur EIN Backend auf demselben data/:
# ./data ist ein Bind-Mount, der Container und Host teilen sich also dieselbe
# metadata.duckdb. DuckDB laesst nur einen schreibenden Prozess zu. Laeuft parallel
# ein Host-Backend (scripts/run_product.py, Tauri, Streamlit), verweigert eines von
# beiden mit klarer Meldung den Start (storage/instance_lock.py). Also entweder
# Docker ODER Host — nicht beides. `docker compose down` beendet den Stack.

services:
  backend:
    build:
      context: .
      args:
        # Set to "true" to bake a LaTeX toolchain in for compiled-PDF exports.
        INSTALL_LATEX: "false"
    image: sciencekg-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data            # persist DuckDB, PDFs, exports, notes
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      - ./ontology.yaml:/app/ontology.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Kein `restart: unless-stopped`: ein vergessener Stack kam nach jedem Neustart
    # von selbst zurueck, griff sich den DuckDB-Lock und liess die UI leer aussehen.
    # `on-failure` faengt echte Abstuerze ab, ohne den Stack zu verewigen.
    restart: on-failure:3
    stop_grace_period: 30s          # Zeit fuer sauberes Schliessen der DuckDB (WAL-Checkpoint)

  frontend:
    build:
      context: ./frontend
      args:
        # The browser (on the host) reaches the backend at this host-published URL.
        VITE_API_BASE_URL: "http://localhost:8000"
    image: sciencekg-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: on-failure:3
