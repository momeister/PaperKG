[package]
name = "sciencekg-desktop"
version = "0.1.0"
description = "Native ScienceKG/PaperKG desktop shell (Tauri)"
authors = ["Moritz Meister-Kleutsch"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# AI-Cursor overlay (R1): global hotkey to toggle the always-on-top window.
tauri-plugin-global-shortcut = "2"
# Embedded Code-Werkstatt terminal: cross-platform PTY (Windows ConPTY / Unix).
portable-pty = "0.8"
# Random token for the optional JupyterLab sidecar (R3).
getrandom = "0.2"
# Desktop Companion (R6): native primary-monitor screenshots for the screen-aware
# assistant. `image` matches xcap's own dependency so RgbaImage is one shared type.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Native Selbst-Steuerung (R7 skeleton): synthesize real mouse/keyboard input.
# Every command is gated on an explicit "armed" state + config flag; the control
# border is visible whenever input synthesis is possible.
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
# Hide the companion overlay windows from screen captures (WDA_EXCLUDEFROMCAPTURE).
# Version matches tauri's, so `window.hwnd()` returns exactly this crate's HWND.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
