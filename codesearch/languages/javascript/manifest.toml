display = "JavaScript"
extensions = ["js", "mjs", "cjs", "jsx"]
comment_prefixes = ["//", "/*", "*"]
doc_style = "leading_comment"

decision_nodes = [
  "if_statement", "while_statement", "for_statement", "for_in_statement",
  "do_statement", "switch_case", "catch_clause", "ternary_expression",
  "binary_expression",
]
block_nodes = ["statement_block"]

test_prefixes = ["test", "it", "describe"]
test_suffixes = [".test", ".spec"]
entry_names = ["main"]

[effects]
file_read = ["readFile", "readFileSync", "createReadStream", "readdir"]
file_write = ["writeFile", "writeFileSync", "createWriteStream", "mkdir", "unlink", "rename"]
network = ["fetch(", "axios", "http.request", "https.request", "XMLHttpRequest", "WebSocket", "got("]
database = ["query(", "execute(", "findOne", "findMany", "insertOne", "updateOne", "collection(", "knex"]
process_spawn = ["child_process", "spawn(", "exec(", "execSync", "fork("]
console = ["console.", "process.stdout", "process.stderr"]
randomness = ["Math.random", "randomUUID", "randomBytes", "crypto.getRandomValues"]
time = ["Date.now", "new Date", "performance.now", "setTimeout", "setInterval"]
environment = ["process.env", "import.meta.env"]
