# ScienceKG Phase 1 Configuration
# Harvester, Storage, and Deduplication Setup

harvester:
  # ArXiv API
  arxiv:
    base_url: "https://export.arxiv.org/api/query"
    requests_per_second: 0.333  # 3 second pause between requests (arXiv recommendation)
    timeout_seconds: 30
    max_papers_per_search: 100

  # Semantic Scholar API
  semantic_scholar:
    api_key: null  # Prefer SEMANTIC_SCHOLAR_API_KEY or S2_API_KEY in .env
    base_url_graph: "https://api.semanticscholar.org/graph/v1"
    base_url_recommendations: "https://api.semanticscholar.org/recommendations/v1"
    requests_per_second: 1.0
    timeout_seconds: 30
    max_retries: 3
    initial_retry_delay_seconds: 2.0
    bubble_extension: true  # Enable automatic recommended papers discovery
    bubble_extension_count: 30  # How many recommended papers to fetch

  # OpenAlex API
  openalex:
    api_key: null  # Free tier; set for higher limits
    base_url: "https://api.openalex.org"
    requests_per_second: 10.0
    timeout_seconds: 30

  # Unpaywall API
  unpaywall:
    email: "your-email@example.com"  # Required for Unpaywall API
    base_url: "https://api.unpaywall.org/v2"
    timeout_seconds: 30

  # Papers with Code
  papers_with_code:
    # This API may have limited availability; kept for reference
    timeout_seconds: 30
    token: null

  # Crossref API (no key; supplying a contact mail joins the "polite pool")
  crossref:
    base_url: "https://api.crossref.org"
    mailto_env: "CROSSREF_MAILTO"  # falls back to the Unpaywall email
    requests_per_second: 5.0
    timeout_seconds: 30

  # Europe PMC (biomedical; no key). Also backs bioRxiv/medRxiv preprint search.
  europepmc:
    base_url: "https://www.ebi.ac.uk/europepmc/webservices/rest"
    requests_per_second: 5.0
    timeout_seconds: 30

  # CORE v3 (260M+ open-access full texts; requires a free API key)
  core:
    base_url: "https://api.core.ac.uk/v3"
    api_key_env: "CORE_API_KEY"
    requests_per_second: 1.0
    timeout_seconds: 45

  # DOAJ (open-access journals across all disciplines; no key)
  doaj:
    base_url: "https://doaj.org/api/v2"
    requests_per_second: 2.0
    timeout_seconds: 30

  # bioRxiv/medRxiv native API (DOI/recent-preprint resolution; no key)
  biorxiv:
    base_url: "https://api.biorxiv.org"
    requests_per_second: 2.0
    timeout_seconds: 30

# Deep research / grey (web) sources. Used only on explicit request; results are
# project-scoped supplementary context and are never written to the knowledge graph.
research:
  default_provider: "duckduckgo"  # duckduckgo | searxng | tavily | brave
  timeout_seconds: 30
  # Optional domain allow/block lists applied to every web result.
  allowed_domains: []
  blocked_domains: []
  providers:
    duckduckgo: {}
    searxng:
      # Self-hosted metasearch (max privacy). Set base_url or env SEARXNG_BASE_URL.
      base_url: null
    tavily:
      api_key_env: "TAVILY_API_KEY"
    brave:
      api_key_env: "BRAVE_API_KEY"

storage:
  # PDF Storage
  pdf_base_dir: "data/pdfs"
  
  # Metadata Database
  duckdb_path: "data/metadata.duckdb"
  vocabulary_path: "data/vocabulary.json"

deduplication:
  # Deduplication strategy
  by_doi: true  # Exact DOI match
  by_normalized_title: true  # Normalized title matching
  keep_highest_version: true  # When duplicates exist, keep the one with highest version

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/sciencekg.log"

# Rate Limiting & Throttling
rate_limits:
  # Global concurrency limit for API requests
  max_concurrent_requests: 5
  # Respect API rate limits per service
  respect_rate_limits: true

# ScienceKG Phase 3 Configuration
# LLM Configuration for Entity Extraction and Analysis

llm:
  # Default provider for all LLM operations
  default_provider: "lm_studio"

  # Supported providers: ollama, lm_studio, openai, openai_compatible, gemini, nvidia
  providers:
    # Ollama - Local open-source models
    ollama:
      provider_type: "ollama"
      base_url: "http://localhost:11434"
      api_key: null  # Ollama doesn't require API key
      timeout_seconds: 1800
      models:
        - "qwen3.6:35b"
        - "llama3.1:8b"
        - "mistral-small:latest"
      
      # Model and Generation Settings
      model: "qwen3.6:35b"
      temperature: 0.2          # Lower = more deterministic
      top_p: 0.95               # Nucleus sampling
      max_tokens: 16384         # Max output tokens for structured extraction
      context_size: 32768       # Max input context
      repeat_penalty: 1.05      # Penalize repeated tokens
      seed: null                # null = random, or specify for reproducibility
      extra_options:
        keep_alive: "0s"        # unload local model after each request

    # LM Studio - Alternative local inference
    lm_studio:
      provider_type: "openai_compatible"
      base_url: "http://localhost:1234/v1"
      api_key: null  # LM Studio doesn't require API key
      timeout_seconds: 1800
      models:
        - "qwen3.6-35b"
        - "llama-3.1-8b-instruct"
        - "mistral-small-3.1"
      
      model: "qwen3.6-35b"      # Model name in LM Studio
      temperature: 0.05
      top_p: 0.8
      max_tokens: 8192
      context_size: 32768
      repeat_penalty: 1.05
      seed: null
      extra_options:
        force_response_format: true
        chat_template_kwargs:
          enable_thinking: false

    # OpenAI API - Cloud-based GPT models
    openai:
      provider_type: "openai_compatible"
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"  # Load from environment variable
      timeout_seconds: 60
      models:
        - "gpt-4.1-mini"
        - "gpt-4.1"
        - "gpt-4o"
      
      model: "gpt-4o"
      temperature: 0.3
      top_p: 0.95
      max_tokens: 16384
      context_size: 128000
      repeat_penalty: null  # OpenAI doesn't support repeat_penalty

    # Google Gemini API - OpenAI-compatible Gemini Developer API endpoint
    # Keep the real key in GEMINI_API_KEY (shell env or local .env), never in config.yaml.
    gemini:
      provider_type: "openai_compatible"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      api_key_env: "GEMINI_API_KEY"
      timeout_seconds: 900
      models:
        - "gemini-3.1-flash-lite"
        - "gemini-3.1-flash-lite-preview"
        - "gemini-3-flash-preview"

      model: "gemini-3.1-flash-lite"
      temperature: 0.05
      top_p: 0.8
      max_tokens: 16384
      context_size: 1048576
      repeat_penalty: null
      extra_options:
        force_response_format: true
        omit_extra_body: true

    # NVIDIA NIM / build.nvidia.com - OpenAI-compatible hosted models
    # Keep the real key in NVIDIA_API_KEY (shell env or local .env), never in config.yaml.
    nvidia:
      provider_type: "nvidia"
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
      timeout_seconds: 900
      models:
        - "moonshotai/kimi-k2.6"
        - "moonshotai/kimi-k2-thinking"
        - "qwen/qwen3.5-397b-a17b"
        - "minimaxai/minimax-m2.7"
        - "nvidia/nemotron-3-nano-30b-a3b"

      model: "moonshotai/kimi-k2.6"
      temperature: 0.05
      top_p: 0.8
      max_tokens: 16384
      context_size: 256000
      repeat_penalty: null
      extra_options:
        omit_extra_body: true
        include_reasoning: false
        chat_template_kwargs:
          thinking: false

    # NVIDIA self-hosted NIM - run the model locally, then point PaperKG here.
    # The NGC/NVIDIA key is used by Docker/NIM to pull and cache the model, not sent to localhost.
    nvidia_local_nim:
      provider_type: "nvidia"
      base_url: "http://localhost:8000/v1"
      api_key: null
      timeout_seconds: 1800
      models:
        - "moonshotai/kimi-k2.6"

      model: "moonshotai/kimi-k2.6"
      temperature: 0.05
      top_p: 0.8
      max_tokens: 16384
      context_size: 256000
      repeat_penalty: null
      extra_options:
        omit_extra_body: true
        include_reasoning: false
        chat_template_kwargs:
          thinking: false

    # Anthropic Claude - native Messages API (vision-capable, used by the Desktop Companion).
    # Keep the real key in ANTHROPIC_API_KEY (shell env or local .env), never in config.yaml.
    anthropic:
      provider_type: "anthropic"
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120
      models:
        - "claude-sonnet-5"
        - "claude-opus-4-8"
        - "claude-haiku-4-5-20251001"

      model: "claude-sonnet-5"
      max_tokens: 2048
      context_size: 200000
      repeat_penalty: null

    # Generic OpenAI-compatible API (e.g., Ollama exposed via proxy, DeepSeek, etc.)
    custom_api:
      provider_type: "openai_compatible"
      base_url: "https://custom-api.example.com/v1"
      api_key_env: "CUSTOM_API_KEY"
      timeout_seconds: 120
      models:
        - "custom-model"
      
      model: "custom-model"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8192
      context_size: 16384
      repeat_penalty: 1.05

  # Local Docker controls for the self-hosted NVIDIA NIM provider.
  nim_container:
    container_name: "sciencekg-kimi-k2-6-nim"
    image: "nvcr.io/nim/moonshotai/kimi-k2.6:1.7.0-variant"
    host: "localhost"
    host_port: 8000
    container_port: 8000
    cache_dir: "~/.cache/nim"
    shm_size: "32GB"
    gpus: "all"
    runtime: "nvidia"
    env_key_name: "NGC_API_KEY"

  # Entity Extraction
  entity_extraction:
    # Use detailed prompts for better concept extraction
    detailed_prompts: true
    # Link concepts to OpenAlex by default
    link_to_knowledge_base: true
    # Generate embeddings for extracted concepts
    embed_concepts: true

  # Conflict Detection
  conflict_detection:
    enabled: false
    confidence_threshold: 0.7  # Only report conflicts with >= 0.7 confidence
    max_pairs: 20
    max_tokens: 800

  # Batch Processing
  batch_processing:
    # Process papers in batches to optimize API calls
    batch_size: 10
    # Number of parallel jobs (for Celery integration)
    parallel_jobs: 4
    # Retry failed extractions
    max_retries: 2
    retry_delay_seconds: 10
    # Durable job handling
    resume_by_default: true
    job_state_backend: "duckdb"
    broker_url: "redis://localhost:6379/0"
    result_backend: "redis://localhost:6379/1"
    task_queue: "sciencekg.extraction"

embedding:
  backend: "hash-fallback"
  model: "BAAI/bge-m3"
  version: 1
  store: "duckdb"
  table: "entity_embeddings"
  top_k: 10
  similarity_threshold: 0.7

retrieval:
  # Light, relevance-preserving nudge applied when ordering retrieved papers. Lexical
  # relevance stays dominant — a less-cited paper that matches the question better still
  # wins; these only break ties among comparably relevant hits. "New" gives a small
  # bonus (stay up to date), never a penalty for being old.
  ranking:
    citation_weight: 0.4        # bonus = citation_weight * log10(citation_count + 1)
    recency_weight: 0.15        # max bonus for a current-year paper; decays to 0 over the window
    recency_window_years: 5     # papers older than this get no recency bonus (and no penalty)
    max_bonus: 1.5              # hard cap so the nudge never overrides relevance

# Hand-off to an external, local computer-use agent (e.g. UI-TARS-Desktop), surfaced as the
# AI-Cursor overlay's two modes: Selbst-Steuerung (autonomous, drives mouse/keyboard) and
# Assistent (periodic screen description + live Q&A, never touches mouse/keyboard). A
# Parallel-Research variant is compiled into a task brief (query/agent_handoff.py). Kanal A
# (Brief kopieren -> in den Agenten einfügen) works regardless of this block.
# `enabled` only gates the **web-mode** fallback (no native overlay, no on-demand sidecar):
# there, Kanal B ("Jetzt ausführen") stays off until you flip this to true. The native
# AI-Cursor overlay does NOT read `enabled` — clicking "Starten" there is itself the
# consent gesture, and Tauri spawns/kills the bridge/uitars sidecar on demand regardless
# of this flag (see `helper_enabled` below to disable just the Assistent sub-mode).
agent_bridge:
  enabled: false
  type: "ui_tars_desktop"          # bridge flavour (only ui_tars_desktop is wired today)
  url: "http://127.0.0.1:8787/run" # web-mode fallback: a manually-started bridge (bridge/uitars/)
  timeout_seconds: 600
  # The VLM that actually sees the screen runs *inside* the bridge (bridge/uitars/), served
  # via one of your existing local providers below (base_url is resolved from
  # llm.providers[vlm_provider] — no need to repeat it here). Native mode forwards these to
  # the bridge process as env vars (VLM_BASE_URL/VLM_MODEL/HELPER_VLM_MODEL); web mode still
  # needs them set by hand when starting `bridge/uitars` manually. There's a hard asymmetry
  # between the two overlay modes: Selbst-Steuerung's `vlm_model` MUST be a UI-TARS-family
  # model — @ui-tars/action-parser only parses the specific click/type action grammar those
  # models are trained to emit, so a general chat/vision model just produces unparseable
  # prose there. Assistent has no such constraint — `helper_vlm_model` (defaults to
  # `vlm_model` if unset) can be any vision-capable local model (e.g. a vision Gemma variant),
  # and often answers better since it isn't specialized for GUI grounding.
  vlm_provider: "lm_studio"
  vlm_model: "ui-tars-1.5-7b"
  # helper_vlm_model: "gemma-3-27b-it"   # uncomment + set to use a different model for Assistent
  # Native desktop app only: let Tauri spawn/kill bridge/uitars itself (agent_bridge_ensure/
  # _stop in src-tauri/src/agent_bridge.rs) on a fresh per-launch port instead of requiring
  # you to run `npm start` by hand. Needs Node.js >= 18 on PATH + `npm install` already run
  # in bridge/uitars. Falls back to the manual/`url` flow above if unavailable.
  manage_sidecar: true
  # Assistent (helper) mode: periodic screenshot -> local VLM description, kept as a rolling
  # context for live Q&A. Screenshots never leave the bridge process or get persisted.
  helper_enabled: true
  observe_interval_seconds: 4      # screenshot cadence
  observe_context_size: 8          # rolling descriptions kept per session

# Desktop Companion (native AI-Cursor, UI-TARS-free): screen-aware chat + "zeig mir"
# pointer + region-explain. Screenshots are captured natively (Rust, src-tauri/src/
# capture.rs) and answered via the normal LLMRouter (POST /companion/*) — the model
# must be vision-capable. Local providers (lm_studio/ollama) keep everything on-device;
# picking the `anthropic` provider is the explicit opt-in to send screenshots to the
# Anthropic API. The overlay's provider/model picker overrides these defaults per call.
companion:
  provider: "lm_studio"
  model: "qwen/qwen3-vl-8b"          # hint default — load a Qwen3-VL build in LM Studio
  # Screenshot pixel budget before the VLM sees it (1280*28*28, Qwen smart-resize
  # multiples). Keeps the frame under LM Studio's silent-downscale cap so the model's
  # pixel coordinates match what we sent — the root cause of the old wrong-pointer bug.
  grounding_max_pixels: 1003520
  language: "de"
  history_turns: 8                   # prior chat turns sent along per question
  # Antwortbudget pro Frage. Thinking-Modelle (z.B. Qwen3.x-Thinking-Builds) brauchen
  # Headroom: ist das Budget zu klein, geht alles ins Nachdenken und es kommt keine
  # Antwort — der Companion meldet das dann als klaren Fehler statt Denkprotokoll.
  max_tokens: 2000
  # Haengt Qwen3s /no_think-Soft-Switch an den Systemprompt (nur bei Qwen-Modellen),
  # damit Antworten schnell kommen statt im Thinking-Kanal zu versickern.
  disable_thinking: true
  # Diagnose fuer falsch zeigende Ringe: true schreibt pro /companion/guide-Aufruf das
  # ans VLM gesendete Bild mit Markern an den Modell-Koordinaten + JSON-Protokoll nach
  # data/companion_debug/ — so sieht man sofort, ob das Modell falsch zeigt oder die
  # Rueckskalierung. Im Normalbetrieb aus lassen (Screenshots landen sonst auf Platte).
  debug_capture: false

# Code-Werkstatt: where *managed* coding projects are created on disk. They live
# as plain Git folders so other editors (VS Code, …) can open them too; PaperKG
# only registers them (DuckDB `code_projects`). "Ordner öffnen" registers an
# existing folder from anywhere as an external project. Default if unset:
# ~/Documents/PaperKG-Projekte. `~` and $ENV are expanded.
code_workspaces:
  base_dir: "~/Documents/PaperKG-Projekte"
