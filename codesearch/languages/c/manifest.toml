display = "C"
extensions = ["c", "h"]
comment_prefixes = ["//", "/*", "*"]
doc_style = "leading_comment"

decision_nodes = [
  "if_statement", "while_statement", "for_statement", "do_statement",
  "case_statement", "conditional_expression", "binary_expression",
]
block_nodes = ["compound_statement"]

test_prefixes = ["test_"]
test_suffixes = ["_test"]
entry_names = ["main"]

[effects]
file_read = ["fopen", "fread", "fgets", "read(", "opendir"]
file_write = ["fwrite", "fputs", "fprintf", "write(", "remove(", "rename("]
network = ["socket(", "connect(", "send(", "recv(", "curl_"]
database = ["sqlite3_", "PQexec", "mysql_query"]
process_spawn = ["fork(", "exec", "system(", "popen("]
console = ["printf", "puts", "fputs(stdout", "perror"]
randomness = ["rand(", "random(", "arc4random"]
time = ["time(", "clock(", "gettimeofday", "sleep("]
environment = ["getenv", "setenv"]
