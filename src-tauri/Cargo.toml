[package]
name = "sciencekg-desktop"
version = "0.1.0"
description = "Native ScienceKG/PaperKG desktop shell (Tauri)"
authors = ["Moritz Meister-Kleutsch"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# AI-Cursor overlay (R1): global hotkey to toggle the always-on-top window.
tauri-plugin-global-shortcut = "2"
# Embedded Code-Werkstatt terminal: cross-platform PTY (Windows ConPTY / Unix).
portable-pty = "0.8"
